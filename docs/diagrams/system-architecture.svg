<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Arial, Helvetica, sans-serif">
  <title>FlowVision System Architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
    <!-- Desktop computer: tower + monitor -->
    <g id="desktop">
      <rect x="-36" y="-22" width="13" height="42" rx="2" fill="#111"/>
      <rect x="-30.5" y="-15" width="2" height="2" fill="#fff"/>
      <rect x="-17" y="-22" width="52" height="34" rx="3" fill="#fff" stroke="#111" stroke-width="4"/>
      <rect x="5" y="12" width="8" height="6" fill="#111"/>
      <rect x="-3" y="18" width="24" height="3" rx="1.5" fill="#111"/>
    </g>
  </defs>

  <rect width="960" height="640" fill="#fff"/>

  <!-- ===== Connections (all two-way) ===== -->
  <g stroke="#111" stroke-width="1.6" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="480" y1="166" x2="480" y2="248"/>
    <line x1="150" y1="466" x2="444" y2="384"/>
    <line x1="370" y1="466" x2="466" y2="386"/>
    <line x1="590" y1="466" x2="494" y2="386"/>
    <line x1="810" y1="466" x2="516" y2="384"/>
  </g>

  <!-- Connection labels -->
  <g font-size="11" fill="#666" text-anchor="middle">
    <text x="490" y="211" text-anchor="start">SQL · Sequelize</text>
    <rect x="392" y="418" width="176" height="18" fill="#fff"/>
    <text x="480" y="431">HTTPS · WebSocket (realtime)</text>
  </g>

  <!-- ===== Cloud Database ===== -->
  <g transform="translate(466 82)">
    <circle cx="-20" cy="6" r="14" fill="#111"/>
    <circle cx="0" cy="-6" r="19" fill="#111"/>
    <circle cx="20" cy="5" r="14" fill="#111"/>
    <rect x="-20" y="4" width="40" height="15" fill="#111"/>
    <rect x="42" y="-8" width="20" height="5" rx="2.5" fill="#111"/>
    <rect x="42" y="1" width="20" height="5" rx="2.5" fill="#111"/>
    <rect x="42" y="10" width="20" height="5" rx="2.5" fill="#111"/>
  </g>
  <text x="480" y="135" font-size="16" font-weight="700" text-anchor="middle" fill="#111">Cloud Database</text>
  <text x="480" y="153" font-size="12" text-anchor="middle" fill="#555">MySQL</text>


  <!-- ===== FlowVision Web Server ===== -->
  <g transform="translate(480 288)" stroke="#111" stroke-width="3.5" fill="#fff">
    <rect x="-36" y="-32" width="72" height="19" rx="3"/>
    <rect x="-36" y="-10" width="72" height="19" rx="3"/>
    <rect x="-36" y="12" width="72" height="19" rx="3"/>
    <g fill="#111" stroke="none">
      <circle cx="22" cy="-22.5" r="2.6"/><circle cx="14" cy="-22.5" r="2.6"/>
      <circle cx="22" cy="-0.5" r="2.6"/><circle cx="14" cy="-0.5" r="2.6"/>
      <circle cx="22" cy="21.5" r="2.6"/><circle cx="14" cy="21.5" r="2.6"/>
      <rect x="-26" y="-24" width="22" height="3" rx="1.5"/>
      <rect x="-26" y="-2" width="22" height="3" rx="1.5"/>
      <rect x="-26" y="20" width="22" height="3" rx="1.5"/>
    </g>
  </g>
  <text x="480" y="346" font-size="16" font-weight="700" text-anchor="middle" fill="#111">FlowVision Web Server</text>
  <text x="480" y="364" font-size="12" text-anchor="middle" fill="#555">Nuxt 4 (Nitro) · Vercel</text>

  <!-- ===== Users ===== -->
  <use href="#desktop" x="150" y="500"/>
  <text x="150" y="548" font-size="16" font-weight="700" text-anchor="middle" fill="#111">Admin</text>
  <text x="150" y="566" font-size="12" text-anchor="middle" fill="#555">Organization Administrator · Web</text>

  <use href="#desktop" x="370" y="500"/>
  <text x="370" y="548" font-size="16" font-weight="700" text-anchor="middle" fill="#111">Department Head</text>
  <text x="370" y="566" font-size="12" text-anchor="middle" fill="#555">Office Head · Web</text>

  <use href="#desktop" x="590" y="500"/>
  <text x="590" y="548" font-size="16" font-weight="700" text-anchor="middle" fill="#111">Staff</text>
  <text x="590" y="566" font-size="12" text-anchor="middle" fill="#555">Office Staff · Web · QR Scan</text>

  <g transform="translate(810 498)">
    <rect x="-15" y="-26" width="30" height="50" rx="6" fill="#fff" stroke="#111" stroke-width="4"/>
    <rect x="-5" y="-21" width="10" height="2.5" rx="1.25" fill="#111"/>
    <circle cx="0" cy="17" r="2.5" fill="#111"/>
  </g>
  <text x="810" y="548" font-size="16" font-weight="700" text-anchor="middle" fill="#111">Messenger</text>
  <text x="810" y="566" font-size="12" text-anchor="middle" fill="#555">Liaison · Mobile Web · QR Scan</text>
</svg>
